name: Crosby
description: 'Crosby is an agentic law firm that combines AI legal agents with barred attorneys to review
  commercial contracts in about an hour. Built for sales teams, it accelerates contract negotiation and
  time-to-signature with fixed, upfront per-document pricing, and integrates into existing workflows via
  Slack, email, and CLM/CRM triggers. Beyond contract review it offers business-specific knowledge agents
  and aggregated market data to improve negotiation outcomes. NYC-based, founded by Ryan Daniels and John
  Sarihan, and backed by Bain Capital Ventures, Index Ventures, and Lux Capital. Crosby publishes no public
  developer API, SDKs, or OpenAPI surface as of this profiling.'
